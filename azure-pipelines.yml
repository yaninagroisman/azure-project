trigger:
  branches:
    include:
      - main
      - feature/advanced-ci

pool:
  vmImage: 'ubuntu-24.04'

variables:
  major: '1'
  minor: '0'
  version: '$(major).$(minor).$(Build.BuildId)'

steps:
  - checkout: self
    fetchDepth: 0

  - bash: |
      set -euo pipefail

      echo "🛡️ RELEASE GUARDIAN — PREFLIGHT"

      echo "Checking source files..."
      test -s HelloWorld/Program.cs
      test -f HelloWorld/HelloWorld.csproj

      echo "Checking C# project XML..."
      python3 - <<'PY'
      import xml.etree.ElementTree as ET
      ET.parse("HelloWorld/HelloWorld.csproj")
      print("Project XML: VALID")
      PY

      echo "Checking whitespace and conflict markers..."
      empty_tree=$(git hash-object -t tree /dev/null)
      git diff --check "$empty_tree" HEAD -- HelloWorld/

      echo "✅ Guardian Preflight PASSED"
    displayName: 'Guardian Preflight - Fast Checks'


  - task: UseDotNet@2
    displayName: 'Install .NET SDK'
    inputs:
      packageType: 'sdk'
      version: '8.0.x'

  - script: |
      echo "Application Version: $(version)"
      echo "Build ID: $(Build.BuildId)"
    displayName: 'Generate and Print Version'

  - script: |
      dotnet restore HelloWorld/HelloWorld.csproj
      dotnet restore ReleaseGuardian.Tests/ReleaseGuardian.Tests.csproj
    displayName: 'Restore Dependencies'

  - task: SonarCloudPrepare@4.4.0
    displayName: 'Guardian Security - Prepare Analysis'
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/feature/advanced-ci'))
    inputs:
      SonarCloud: 'SonarQube-ReleaseGuardian'
      organization: 'yaninagroisman'
      scannerMode: 'dotnet'
      projectKey: 'yaninagroisman_azure-project'
      extraProperties: |
        sonar.qualitygate.wait=true
        sonar.qualitygate.timeout=300
        sonar.qualitygate.wait=true
        sonar.qualitygate.timeout=300
        sonar.cs.opencover.reportsPaths=$(Agent.TempDirectory)/TestResults/**/coverage.opencover.xml

  - script: |
      dotnet build HelloWorld/HelloWorld.csproj \
        --configuration Release \
        --no-restore \
        -p:Version=$(version)
    displayName: 'Build .NET Application'

  - script: |
      dotnet test ReleaseGuardian.Tests/ReleaseGuardian.Tests.csproj \
        --configuration Release \
        --no-restore \
        --collect:"XPlat Code Coverage" \
        --logger "trx;LogFileName=guardian-tests.trx" \
        --results-directory "$(Agent.TempDirectory)/TestResults" \
        -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
    displayName: 'Guardian Unit Tests with Coverage'

  - bash: |
      echo "Checking OpenCover reports..."

      find "$(Agent.TempDirectory)/TestResults" \
        -name "coverage.opencover.xml" \
        -type f \
        -print

      test -n "$(find "$(Agent.TempDirectory)/TestResults" -name 'coverage.opencover.xml' -print -quit)"
    displayName: 'Guardian - Verify Coverage Report'

  - task: PublishTestResults@2
    displayName: 'Publish Guardian Test Results'
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: 'VSTest'
      testResultsFiles: 'guardian-tests.trx'
      searchFolder: '$(Agent.TempDirectory)/TestResults'
      testRunTitle: 'Release Guardian Unit Tests'
      failTaskOnFailedTests: true


  - script: dotnet HelloWorld/bin/Release/net8.0/HelloWorld.dll
    displayName: 'Smoke Test'

  - task: SonarCloudAnalyze@4.4.0
    displayName: 'Guardian Security - Analyze Code'
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/feature/advanced-ci'))

  - task: SonarCloudPublish@4.4.0
    displayName: 'Guardian Security - Quality Gate'
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/feature/advanced-ci'))
    inputs:
      pollingTimeoutSec: '300'

  - script: |
      dotnet publish HelloWorld/HelloWorld.csproj \
        --configuration Release \
        --no-restore \
        -p:Version=$(version) \
        -p:UseAppHost=false \
        --output $(Build.ArtifactStagingDirectory)/helloworld
    displayName: 'Prepare Application for Publishing'

  - task: UniversalPackages@0
    displayName: 'Publish to Azure Artifacts'
    inputs:
      command: 'publish'
      publishDirectory: '$(Build.ArtifactStagingDirectory)/helloworld'
      feedsToUsePublish: 'internal'
      vstsFeedPublish: 'azure-project/helloworld-feed'
      vstsFeedPackagePublish: 'helloworld'
      versionOption: 'custom'
      versionPublish: '$(version)'
      packagePublishDescription: 'HelloWorld .NET application'

  - bash: |
      echo "Running advanced CI pipeline"
      echo "Current branch: $BRANCH_NAME"
      echo "Full branch reference: $BRANCH_REF"
    displayName: 'Advanced CI - Feature Branch'
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/feature/advanced-ci'))
    env:
      BRANCH_NAME: $(Build.SourceBranchName)
      BRANCH_REF: $(Build.SourceBranch)